[package]
name = "team-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Shared core of the Lunima team agent: config, GitHub via gh, git, Claude runner, prompts, state files."
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
chrono.workspace = true
regex.workspace = true

[target.'cfg(windows)'.dependencies]
# the hidden desktop of agent sessions (`desktop`); same version as the Control Center's
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Environment",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true
