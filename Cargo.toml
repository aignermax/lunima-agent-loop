[workspace]
resolver = "2"
members = ["control-center", "crates/team-core", "crates/team-agent"]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }
tempfile = "3"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
# unwind: a panic in one agent role is caught by its thread; the other roles keep running
panic = "unwind"
