# Builds Lunima Team for every platform:
#   Windows (x64, arm64): lunima-team-agent.exe + lunima-po.exe (Control Center) → zip + MSI (installer/, WiX)
#   Linux (x64, arm64):   lunima-team-agent + lunima-po → tar.gz (install.sh, systemd user unit) + .deb (cargo-deb)
#   macOS (arm64):        lunima-team-agent only → tar.gz (no Control Center build there)
#   push a tag `v*` (e.g. `git tag v0.5.0 && git push origin v0.5.0`) → GitHub release with all assets
#   PR / manual run (Actions → Release → Run workflow)               → assets as workflow artifacts only
name: Release

on:
  push:
    tags: ['v*']
  pull_request:          # build-check every platform on PRs (no release)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,     os: windows-latest,   kind: windows, msi: x64 }
          - { rid: win-arm64,   os: windows-11-arm,   kind: windows, msi: arm64 }
          - { rid: linux-x64,   os: ubuntu-latest,    kind: linux }
          - { rid: linux-arm64, os: ubuntu-24.04-arm, kind: linux }
          - { rid: osx-arm64,   os: macos-latest,     kind: mac }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Version from tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; else v="0.0.${GITHUB_RUN_NUMBER}"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Linux libraries for the Control Center (GTK tray, eframe)
        if: matrix.kind == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libgtk-3-dev libxdo-dev libayatana-appindicator3-dev

      - name: Test
        shell: bash
        run: |
          if [[ "${{ matrix.kind }}" == mac ]]; then
            cargo test -p team-core -p team-agent --locked
          else
            cargo test --workspace --locked
          fi

      - name: Build release binaries
        shell: bash
        run: |
          if [[ "${{ matrix.kind }}" == mac ]]; then
            cargo build --release --locked -p team-agent
          else
            cargo build --release --locked -p team-agent -p lunima-po-center
          fi

      - name: Package (Windows zip)
        if: matrix.kind == 'windows'
        shell: bash
        run: |
          name="lunima-team-${VERSION}-${{ matrix.rid }}"
          mkdir -p "dist/$name"
          cp target/release/lunima-team-agent.exe target/release/lunima-po.exe README.md "dist/$name/"
          cd dist
          pwsh -NoProfile -Command "Compress-Archive -Path '$name' -DestinationPath '$name.zip'"
          rm -rf "$name"

      # WiX v5 builds through the .NET SDK (installer tooling only — no .NET code is shipped)
      - uses: actions/setup-dotnet@v4
        if: matrix.kind == 'windows'
        with:
          dotnet-version: '10.0.x'

      - name: Build MSI
        if: matrix.kind == 'windows'
        shell: bash
        run: |
          dotnet build installer/lunima-team.wixproj -c Release --nologo -p:InstallerPlatform=${{ matrix.msi }} -p:AgentVersion="${VERSION%%-*}" -p:AgentLabel="$VERSION"
          cp installer/bin/Release/*.msi dist/

      - name: Package (Linux tar.gz)
        if: matrix.kind == 'linux'
        run: sh packaging/linux/make-tarball.sh "$VERSION" "${{ matrix.rid }}"

      - name: Install cargo-deb
        if: matrix.kind == 'linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: Package (Debian)
        if: matrix.kind == 'linux'
        run: |
          cargo deb -p lunima-po-center --no-build --deb-version "$VERSION" --output dist/
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb

      - name: Package (macOS tar.gz)
        if: matrix.kind == 'mac'
        shell: bash
        run: |
          name="lunima-team-agent-${VERSION}-${{ matrix.rid }}"
          mkdir -p "dist/$name"
          cp target/release/lunima-team-agent README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
